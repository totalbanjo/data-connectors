name: Polyfill Connectors

# Required-check design mirrors .github/workflows/cross-repo-integrity.yml (see that file's
# top-of-file comment for the full citation trail — PDPP-gateB-final-closure-deep-redteam-2026-08-18.md
# finding B1 / hardening 12.3): no `pull_request.paths` filter (a required workflow skipped via
# path filtering leaves its check permanently "Pending" and blocks merging), a `changes` job
# that always runs and computes relevance via plain `git diff`, the real `verify` job gated on
# that relevance via `needs`+`if`, and one stable always-produced `gate` job
# ("Polyfill Connectors Gate") that is the only context named in branch protection — never
# `verify + test` directly, since GitHub's implicit `success()` on a bare job-level `if:`
# (github/docs#4823) would otherwise let a broken `changes` job silently report green instead
# of failing.

on:
  push:
    branches: [main]
    paths:
      - "packages/polyfill-connectors/**"
      - "scripts/mutation-falsification/**"
      - "scripts/test-accounting/**"
      - "scripts/test-migration/**"
      - "test-accounting.manifest.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/polyfill-connectors.yml"
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: polyfill-connectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether relevant paths changed
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CHANGED="$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER")"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^(packages/polyfill-connectors/|scripts/(mutation-falsification|test-accounting|test-migration)/|test-accounting\.manifest\.json$|package(-lock)?\.json$|\.github/workflows/polyfill-connectors\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: verify + test
    needs: changes
    if: needs.changes.outputs.relevant == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24: this package's node:test usage (--test-concurrency,
          # --test-timeout) and node:fs/promises glob() need it; the rest of
          # this repo's workflows run Node 20 for unrelated npm-only scripts.
          node-version: "24.15.0"

      - name: Install root evidence tooling used by runner contracts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install polyfill-connectors dependencies
        # Scoped to the package, not the repo root: this repo has no npm
        # workspaces wiring for packages/polyfill-connectors (see
        # packages/polyfill-connectors/vendor/README.md for why its two
        # @pdpp/* dependencies install from a checked-in tarball instead of a
        # workspace/registry entry). --ignore-scripts skips patchright's
        # postinstall browser download; the browser the tests DO need is
        # installed explicitly in the next step, so the skip stays deliberate
        # rather than accidental.
        working-directory: packages/polyfill-connectors
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts

      - name: Install Chromium for the capture-redaction proofs
        # `src/capture-trace-redaction.test.ts` launches a real browser: the
        # thing under test is what Playwright WRITES to disk (trace zips,
        # screenshots, DOM snapshots), so a stub cannot prove the redaction.
        # `--with-deps` because the runner image carries no shared libs for it.
        # Run from the package: `playwright` is a dependency of
        # polyfill-connectors, not of the repo root.
        #
        # Ported from PDP-Connect/pdpp's own polyfill-connectors workflow,
        # which already installs exactly this for exactly this suite. Move A
        # brought that suite into this repo but not the browser step, so the
        # install comment above ("verify + test don't launch a browser") became
        # false and six tests failed on a missing chrome-headless-shell.
        working-directory: packages/polyfill-connectors
        run: npx playwright install --with-deps chromium

      - name: Verify (typecheck + biome check)
        working-directory: packages/polyfill-connectors
        run: npm run verify

      - name: Test
        working-directory: packages/polyfill-connectors
        # Excludes the @pdpp/reference-contract-dependent suites; see
        # scripts/run-tests.mjs and tsconfig.json for the file list and the
        # reinstatement note (that package isn't part of Move A's scope).
        run: npm run test

      - name: Pack, install, and run (proves a real npm install of the published tarball works)
        # This step's own dependency install above used --ignore-scripts, so
        # it would never catch a regression here: a real consumer's plain
        # `npm ci` (no --ignore-scripts) runs this package's postinstall
        # hook unconditionally, and a .ts postinstall crashes there with
        # ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING (Node refuses to strip
        # types from any file under node_modules). That crash blocked every
        # downstream consumer's CI at the dependency-install step, before
        # any of that consumer's own code ran — see scripts/pack-install-run.mjs.
        working-directory: packages/polyfill-connectors
        run: npm run pack-install-run

  accounted-suite:
    name: accounted-suite
    needs: changes
    if: needs.changes.outputs.relevant == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
      - name: Verify pinned tools
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(npm --version)" = "11.12.1"
      - name: Install both dependency locks
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/polyfill-connectors ci --ignore-scripts --no-audit --no-fund
      - name: Prepare browser prerequisite
        working-directory: packages/polyfill-connectors
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mutation-browsers
        run: npx playwright install --with-deps chromium
      - name: Measure clean accounted suite and pilot admission
        env:
          MUTATION_PREFLIGHT_BROWSER_SOURCE: ${{ runner.temp }}/mutation-browsers
        run: npm run mutation:groupme-preflight
      - name: Retain accounted-suite evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: accounted-suite-${{ github.event.pull_request.head.sha || github.sha }}
          include-hidden-files: true
          path: |
            .mutation-falsification-evidence/
            .git/test-accounting/runs/
            test-accounting.manifest.json
          retention-days: 90
          if-no-files-found: error

  evidence-tests:
    name: evidence-tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
      - name: Verify pinned tools
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(npm --version)" = "11.12.1"
      - name: Install both dependency locks
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/polyfill-connectors ci --ignore-scripts --no-audit --no-fund
      - name: Prepare browser prerequisite
        working-directory: packages/polyfill-connectors
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mutation-browsers
        run: npx playwright install --with-deps chromium
      - name: Check evidence tooling and contracts
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mutation-browsers
        run: |
          npm run typecheck:mutation-falsification
          npm run test:mutation-falsification
          npm run test:accounting
          npm run test:migration-oracle
      - name: Retain evidence-tests evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-tests-${{ github.event.pull_request.head.sha || github.sha }}
          include-hidden-files: true
          path: |
            .mutation-falsification-evidence/
            .git/test-accounting/runs/
            test-accounting.manifest.json
          retention-days: 90
          if-no-files-found: error

  gate:
    name: Polyfill Connectors Gate
    needs: [changes, verify, accounted-suite, evidence-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate all required job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          EVENT_NAME: ${{ github.event_name }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          ACCOUNTED_RESULT: ${{ needs.accounted-suite.result }}
          EVIDENCE_RESULT: ${{ needs.evidence-tests.result }}
        run: |
          test "$CHANGES_RESULT" = success
          EXPECTED=success
          if [ "$EVENT_NAME" = pull_request ] && [ "$RELEVANT" = false ]; then
            EXPECTED=skipped
          fi
          for RESULT in "$VERIFY_RESULT" "$ACCOUNTED_RESULT" "$EVIDENCE_RESULT"; do
            if [ "$RESULT" != "$EXPECTED" ]; then
              echo "::error::required job reported $RESULT; expected $EXPECTED"
              exit 1
            fi
          done
